<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Father's Day 🫛</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page">
        <h1 class="title">
            A little something for Dad 💙
        </h1>
        <!-- ENVELOPE -->
        <div class="envelope-container" id="envelope">
            <div class="envelope">
                <!-- CARD -->
                <div class="card-wrapper" id="cardWrapper">
                    <div class="card" id="card">
                        <!-- INSIDE OF CARD -->
                        <div class="card-inside">
                            <div class="message">
                                <div class="heart">
                                    💙
                                </div>
                                <h2>
                                    Dear Dad,
                                </h2>
                                <p>
                                    Wishing you a hap-pea Father's Day!🫛
                                </p>
                                <p>
                                    Hope your day is unbe-leaf-able! 🌱
                                </p>
                                <p class="love">
                                    Love Mel, Brad and Kayla xx
                                </p>
                            </div>
                        </div>
                        <!-- FRONT OF CARD -->
                        <div class="card-front">
                            <div class="front-content">
                                <div class="pea">
                                    🫛
                                </div>
                                <h2>
                                    Hap-pea<br>
                                    Father's Day!
                                </h2>
                                <div class="tap-card">
                                    Tap to open 💌
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- ENVELOPE BACK -->
                <div class="envelope-back"></div>
                <!-- ENVELOPE FLAP -->
                <div class="envelope-flap"></div>
                <!-- ENVELOPE FRONT -->
                <div class="envelope-front">
                    <div class="envelope-heart">
                        💙
                    </div>
                    <p>
                        For Dad
                    </p>
                </div>
            </div>
        </div>
        <p class="instructions" id="instructions">
            Tap the envelope to open 💌
        </p>
    </div>
    <script src="script.js"></script>
</body>
</html>
